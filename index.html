<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> divine timing </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FAF8F5; /* Soft warm off-white */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .time-display {
            font-size: clamp(2.2rem, 8vw, 3.5rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            color: #E89A68; /* Soft pale orange */
            font-variant-numeric: tabular-nums;
            transition: color 0.6s ease, filter 0.6s ease;
            user-select: none;
            white-space: nowrap;
        }

        .pulse-active {
            color: #D98A50;
            filter: drop-shadow(0 0 10px rgba(217, 138, 80, 0.2));
        }
    </style>
</head>
<body>

    <div id="clock" class="time-display">01:01:01</div>

    <script>
        const clockEl = document.getElementById('clock');

        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        function updateMappedTime() {
            const now = new Date();
            
            // Standard seconds passed since midnight
            const stdSeconds = (now.getHours() * 3600) + (now.getMinutes() * 60) + now.getSeconds() + (now.getMilliseconds() / 1000);
            
            // Proportion of day completed (0.0 to 1.0)
            const dayProgress = stdSeconds / 86400;

            // Map progress onto 25:61:61 total volume (93,025 units)
            let aeonicUnits = Math.floor(dayProgress * 93025);

            // Deconstruct into 25:61:61 registers (+1 offset for Monad 01-start)
            let secondsPerMinute = 61;
            let secondsPerHour = 61 * 61; // 3721

            let h = Math.floor(aeonicUnits / secondsPerHour) + 1;
            let remAfterHours = aeonicUnits % secondsPerHour;

            let m = Math.floor(remAfterHours / secondsPerMinute) + 1;
            let s = (remAfterHours % secondsPerMinute) + 1;

            // Cap limits safely
            if (h > 25) h = 25;
            if (m > 61) m = 61;
            if (s > 61) s = 61;

            // Threshold transition at 25:61:61
            if (h === 25 && m === 61 && s === 61) {
                clockEl.classList.add('pulse-active');
            } else {
                clockEl.classList.remove('pulse-active');
            }

            clockEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
        }

        // Run continuous real-time mapping sync
        setInterval(updateMappedTime, 500);
        updateMappedTime();
    </script>
</body>
</html>
